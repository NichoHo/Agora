name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vault"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # -p 1: test packages share one database and recreate their schemas
      - run: go test -race -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://vault:vault@localhost:5432/vault
      # AGORA_SPEC.md section 12: govulncheck on every push/PR, not just before deploy.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build
        run: |
          if [ -f web/package.json ]; then
            cd web && npm ci && npm run build
          else
            echo "web not scaffolded yet"
          fi
      - name: npm audit
        run: |
          if [ -f web/package.json ]; then
            cd web && npm audit --omit=dev
          fi

  assist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r assist/requirements.txt pytest pip-audit
      - run: python -m pytest assist/tests -q
      # Ignored IDs are transitive vulns blocked on bumping fastapi/opentelemetry
      # past what assist/requirements.txt pins (a breaking change, not a patch);
      # see the comments there. Everything else fails the build.
      - run: pip-audit -r assist/requirements.txt --ignore-vuln PYSEC-2026-3447 --ignore-vuln PYSEC-2026-1805 --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-1942 --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-248

  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/risk/requirements.txt pytest pip-audit
      - run: python -m pytest services/risk -q
      # Same blocked-transitive-vuln set as assist; see that job's comment.
      - run: pip-audit -r services/risk/requirements.txt --ignore-vuln PYSEC-2026-3447 --ignore-vuln PYSEC-2026-1805 --ignore-vuln PYSEC-2026-1941 --ignore-vuln PYSEC-2026-1942 --ignore-vuln PYSEC-2026-161 --ignore-vuln PYSEC-2026-2281 --ignore-vuln PYSEC-2026-2280 --ignore-vuln PYSEC-2026-249 --ignore-vuln PYSEC-2026-248
